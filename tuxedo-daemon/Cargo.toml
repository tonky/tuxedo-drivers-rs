[package]
name = "tuxedo-daemon"
version = "0.1.0"
edition = "2021"
description = "TUXEDO Hardware Daemon — userspace driver for TUXEDO laptops"
license = "GPL-2.0-only"

[dependencies]
tokio = { version = "1", features = ["full"] }
zbus = { version = "5", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
nix = { version = "0.31", features = ["ioctl", "fs", "uio"] }
sd-notify = "0.5"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
